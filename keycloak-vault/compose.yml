services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:?set KC_DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: keycloak/keycloak:26.8
    restart: unless-stopped
    command: start
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?set KC_DB_PASSWORD in .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?set KC_ADMIN_PASSWORD in .env}
      KC_HOSTNAME: ${KC_HOSTNAME:?set KC_HOSTNAME in .env}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8888:8080"

  vault:
    image: hashicorp/vault:1.19
    restart: unless-stopped
    user: "0:0"
    cap_add:
      - IPC_LOCK
    # command: server
    environment:
      # VAULT_ADDR: http://127.0.0.1:8200
      # VAULT_API_ADDR: http://${VAULT_HOSTNAME:?set VAULT_HOSTNAME in .env}:8200
      - VAULT_UI=true  # Enable built-in UI
      - VAULT_ADDR=http://192.168.10.176:8200
      - VAULT_API_ADDR=http://192.168.10.176:8200
    volumes:
      - vault_data:/vault/data
      #- ./vault/data:/vault/data
      - ./vault/config:/vault/config:ro
      - ./vault/policies:/vault/policies:ro
      # - ./vault.hcl:/vault/config/vault.hcl:ro
    command: vault server -config=/vault/config/vault.hcl
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD-SHELL", "CODE=$$(vault status -format=json >/dev/null 2>&1; echo $$?); [ $$CODE -eq 0 ] || [ $$CODE -eq 2 ]"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  vault_data:
